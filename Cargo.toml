[package]
name = "BeamMP-Panel"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "A desktop application for managing BeamMP dedicated servers"
license = "MIT"
authors = ["Aspenini"]

[dependencies]
# `persistence` remembers window size/position and panel layout between runs.
# `glow` (OpenGL) is the primary renderer for its low memory use; the default
# wgpu renderer stays as a fallback where OpenGL is unavailable (e.g. RDP).
eframe = { version = "0.37", features = ["persistence", "glow"] }
egui = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Format-preserving TOML: edits ServerConfig.toml without dropping comments or unknown keys
toml_edit = { version = "0.25", features = ["serde"] }
directories = "6.0"
rfd = "0.17"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
# Only read zip metadata; skip every compression codec
zip = { version = "9", default-features = false }
# Only used to decode the embedded window icon
image = { version = "0.25", default-features = false, features = ["ico"] }

# System tray needs a GTK main loop on Linux, so it is only enabled where it
# runs on winit's own event loop.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# Job object so hidden server processes die with the panel instead of orphaning
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
