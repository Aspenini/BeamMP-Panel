[package]
name = "BeamMP-Panel"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "A desktop application for managing BeamMP dedicated servers"
license = "MIT"
authors = ["Aspenini"]

[dependencies]
eframe = "0.35"
egui = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
directories = "6.0"
rfd = "0.17"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
# Only read zip metadata + deflate entries; skip aes/bzip2/lzma/zstd/xz codecs
zip = { version = "8", default-features = false, features = ["deflate"] }
# Only used to decode the embedded window icon
image = { version = "0.25", default-features = false, features = ["ico"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3           # Maximum optimizations
lto = "thin"            # Link-time optimization
codegen-units = 1       # Better optimization, slower compile
strip = true            # Strip symbols from binary
panic = "abort"         # Smaller binary, no unwinding

[profile.release.package."*"]
opt-level = 3

[package.metadata.wix]
upgrade-guid = "9C5E5B5E-5E5E-4E5E-9E5E-5E5E5E5E5E5E"
path-guid = "A1A1A1A1-A1A1-A1A1-A1A1-A1A1A1A1A1A1"
license = false
eula = false

